<!-- Satin · animación de carga. Va dentro de index.html: el <style> en <head> y el <div> dentro de #root.
     React sustituye el contenido de #root al montar: si eso ocurre antes de 300 ms, la animación nunca se ve.
     Sin JavaScript, sin retraso artificial; con movimiento reducido el símbolo queda quieto. -->
<style>
html{background:#0b0a08}
.satin-carga{position:fixed;inset:0;display:grid;place-items:center;opacity:0;animation:satin-aparece .24s ease-out .3s forwards}
.satin-carga svg{width:clamp(88px,24vmin,136px);height:auto;fill:#e6c686}
.satin-carga g{opacity:.38;animation:satin-brillo 1.5s ease-in-out calc(.3s + var(--i) * .11s) infinite}
@keyframes satin-aparece{to{opacity:1}}
@keyframes satin-brillo{0%,100%{opacity:.38}35%{opacity:1}}
@media (prefers-reduced-motion:reduce){.satin-carga{animation:satin-aparece 1ms steps(1) .3s forwards}.satin-carga g{animation:none;opacity:1}}
</style>
